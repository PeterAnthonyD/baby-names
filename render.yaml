# Render Blueprint: one web service plus one Postgres database.
# In Render: New > Blueprint, pick this repo, and apply.
services:
  - type: web
    name: baby-names
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: baby-names-db
          property: connectionString

databases:
  - name: baby-names-db
    plan: basic-256mb
